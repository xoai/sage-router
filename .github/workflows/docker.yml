name: Docker

# Publishes multi-arch container images to Docker Hub AND GHCR.
#
#   push to main          → :latest
#   push of v* tag (e.g.  → :v1.2.3   (verbatim ref name)
#   v1.2.3)
#
# Platforms: linux/amd64, linux/arm64.
#
# Required secrets (Repo Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — Docker Hub account (e.g., `xoai`)
#   DOCKERHUB_TOKEN     — Docker Hub access token (Account Settings →
#                         Security → New Access Token, with Read+Write).
#                         NOT your Docker Hub password.
#
# GHCR auth uses the workflow's built-in GITHUB_TOKEN; no manual secret
# needed. Make sure the repo's package settings allow Actions to push.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write  # required to push to ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU enables cross-compilation for linux/arm64 on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the right tag set for the trigger:
      #   - is_default_branch (main push)  → emit `:latest`
      #   - ref event=tag (v* push)        → emit `:<tag>` verbatim
      # Both rules can fire together; metadata-action deduplicates.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sage-router
            ghcr.io/${{ github.repository_owner }}/sage-router
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
