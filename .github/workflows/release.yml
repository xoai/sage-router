name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web/dashboard && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: web/dashboard/dist/

  release:
    runs-on: ubuntu-latest
    needs: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: web/dashboard/dist/
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Docker push moved to docker.yml — handles BOTH main and v* tag
# triggers, pushes to both Docker Hub and GHCR, builds multi-arch
# (linux/amd64 + linux/arm64).
